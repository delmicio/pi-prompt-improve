name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit
      - run: npm pack --dry-run
      - name: Load through Pi without user configuration or provider calls
        shell: bash
        run: |
          export PI_CODING_AGENT_DIR="$(mktemp -d)"
          node node_modules/@earendil-works/pi-coding-agent/dist/cli.js --no-extensions --no-skills --no-prompt-templates --no-themes -e ./index.ts --list-models
